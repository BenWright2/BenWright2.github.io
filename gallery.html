<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Photography Galleries — Emma Sanders</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --cream: #efe3d1;
      --ink: #4a4339;
      --paper: #f6f0e7;
      --serif: 'Playfair Display', Georgia, serif;
      --sans: 'DM Sans', Arial, sans-serif;
      --script: 'Great Vibes', cursive;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
    }

    /* Navigation */

    .nav {
      height: 76px;
      padding: 0 6%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #eee2d0;
    }

    .logo {
      font: 19px var(--serif);
      letter-spacing: .13em;
      text-align: center;
      text-decoration: none;
      color: var(--ink);
    }

    .logo small {
      display: block;
      font: 8px var(--sans);
      letter-spacing: .25em;
      margin-top: 5px;
    }

    .back-link {
      font-size: 9px;
      letter-spacing: .16em;
      text-decoration: none;
      color: var(--ink);
    }

    /* Page heading */

    .gallery-heading {
      text-align: center;
      padding: 100px 20px 65px;
    }

    .tiny {
      font-size: 9px;
      letter-spacing: .2em;
      margin-bottom: 22px;
    }

    .gallery-heading h1 {
      font: clamp(48px, 7vw, 78px)/1.05 var(--serif);
      font-weight: 400;
      margin: 0;
    }

    .gallery-heading h1 em {
      font-weight: 400;
    }

    .gallery-heading > p:last-child {
      max-width: 440px;
      margin: 22px auto 0;
      font: italic 15px/1.8 var(--serif);
      color: #766f65;
    }

    /* Gallery */

    .gallery-container {
      max-width: 1450px;
      padding: 0 5% 110px;
      margin: auto;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      column-gap: 22px;
      align-items: start;
    }

    /* Each column stacks independently to remove empty spaces */

    .gallery-column {
      display: flex;
      flex-direction: column;
      gap: 22px;
      min-width: 0;
    }

    .gallery-item {
      display: block;
      width: 100%;
      margin: 0;
      cursor: pointer;
      border: 0;
      padding: 0;
      background: transparent;
      text-align: left;
      position: relative;
    }

    .gallery-item img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: cover;
      transition: transform .5s ease, opacity .5s ease;
    }

    .gallery-item:hover img {
      transform: scale(1.025);
      opacity: .92;
    }

    .gallery-item figcaption {
      font-size: 8px;
      letter-spacing: .16em;
      color: #766f65;
      padding-top: 11px;
    }

    /* Lightbox */

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(29, 27, 24, .94);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 55px 65px;
    }

    .lightbox.open {
      display: flex;
    }

    .lightbox img {
      max-width: 100%;
      max-height: 85vh;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    .lightbox-close,
    .lightbox-prev,
    .lightbox-next {
      position: absolute;
      border: 0;
      background: none;
      color: white;
      cursor: pointer;
      font-family: var(--sans);
    }

    .lightbox-close {
      top: 20px;
      right: 30px;
      font-size: 32px;
    }

    .lightbox-prev,
    .lightbox-next {
      top: 50%;
      transform: translateY(-50%);
      font-size: 35px;
      padding: 15px;
    }

    .lightbox-prev {
      left: 12px;
    }

    .lightbox-next {
      right: 12px;
    }

    /* Footer */

    footer {
      background: #e9dece;
      padding: 40px 6%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      text-align: center;
    }

    footer p,
    footer small {
      font-size: 8px;
      letter-spacing: .15em;
      color: #766f65;
    }

    /* Tablet */

    @media(max-width: 850px) {
      .gallery-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        column-gap: 15px;
      }

      .gallery-column {
        gap: 15px;
      }

      .gallery-container {
        padding: 0 4% 75px;
      }
    }

    /* Mobile */

    @media(max-width: 520px) {
      .nav {
        height: 68px;
      }

      .logo {
        font-size: 16px;
      }

      .gallery-heading {
        padding: 75px 8% 45px;
      }

      .gallery-heading h1 {
        font-size: 48px;
      }

      .gallery-grid {
        grid-template-columns: 1fr;
      }

      .gallery-container {
        padding: 0 7% 65px;
      }

      .lightbox {
        padding: 50px 35px;
      }

      .lightbox-prev {
        left: 0;
      }

      .lightbox-next {
        right: 0;
      }

      footer {
        flex-direction: column;
      }
    }
  </style>
</head>

  <!-- Click-to-enlarge photo viewer -->

  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" aria-label="Close">&times;</button>
    <button class="lightbox-prev" aria-label="Previous photo">‹</button>
    <img src="" alt="Expanded gallery photograph" id="lightbox-image">
    <button class="lightbox-next" aria-label="Next photo">›</button>
  </div>

  <script>
    const gallery = document.getElementById('gallery');

    // Arrange photos left to right, then stack each column independently.
    function buildGallery() {
      const photos = [...gallery.querySelectorAll('.gallery-item')];

      let columns = 3;

      if (window.innerWidth <= 520) {
        columns = 1;
      } else if (window.innerWidth <= 850) {
        columns = 2;
      }

      gallery.innerHTML = '';

      const columnElements = [];

      for (let i = 0; i < columns; i++) {
        const column = document.createElement('div');
        column.className = 'gallery-column';
        gallery.appendChild(column);
        columnElements.push(column);
      }

      photos.forEach((photo, index) => {
        columnElements[index % columns].appendChild(photo);
      });
    }

    buildGallery();

    let resizeTimer;

    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(buildGallery, 150);
    });

    // Lightbox

    const items = [...document.querySelectorAll('.gallery-item img')];
    const lightbox = document.getElementById('lightbox');
    const lightboxImage = document.getElementById('lightbox-image');

    let currentIndex = 0;

    function showImage(index) {
      currentIndex = (index + items.length) % items.length;

      lightboxImage.src = items[currentIndex].src;
      lightboxImage.alt = items[currentIndex].alt;

      lightbox.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lightbox.classList.remove('open');
      document.body.style.overflow = '';
    }

    items.forEach((img, index) => {
      img.parentElement.addEventListener('click', () => showImage(index));
    });

    document.querySelector('.lightbox-close').addEventListener('click', closeLightbox);

    document.querySelector('.lightbox-prev').addEventListener('click', () => {
      showImage(currentIndex - 1);
    });

    document.querySelector('.lightbox-next').addEventListener('click', () => {
      showImage(currentIndex + 1);
    });

    lightbox.addEventListener('click', event => {
      if (event.target === lightbox) closeLightbox();
    });

    document.addEventListener('keydown', event => {
      if (!lightbox.classList.contains('open')) return;

      if (event.key === 'Escape') closeLightbox();
      if (event.key === 'ArrowLeft') showImage(currentIndex - 1);
      if (event.key === 'ArrowRight') showImage(currentIndex + 1);
    });
  </script>
